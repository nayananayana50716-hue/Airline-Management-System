name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm --prefix airport-app ci

      - name: Install backend dependencies
        run: npm --prefix airport-app-backend ci

      - name: Build frontend
        run: npm --prefix airport-app run build

      - name: Quick backend syntax check
        run: node --check airport-app-backend/server.js

      - name: Lint (optional)
        run: |
          if [ -f airport-app/package.json ]; then
            npm --prefix airport-app run lint || true
          fi

      - name: Start backend for socket smoke test
        run: |
          nohup node airport-app-backend/server.js > backend.log 2>&1 &
          echo $! > backend.pid
          # wait for the backend to respond
          for i in {1..15}; do
            if curl -sS http://localhost:5002 >/dev/null 2>&1; then
              echo "backend ready"; break
            fi
            sleep 1
          done

      - name: Run socket smoke test
        run: node airport-app/tools/socket-test.js

      - name: Tear down backend
        if: always()
        run: |
          if [ -f backend.pid ]; then
            kill "$(cat backend.pid)" || true
          fi
